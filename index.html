		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0b0807;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	<!-- Injected before </body> at deploy time (see .github/workflows/deploy-web.yml).
     bc15975 is replaced with the deployed short SHA. The heavy engine assets are
     content-hashed per deploy (index.<sha>.wasm/.pck/.js), so a fresh index.html always
     pulls fresh assets — this script only bridges the gap while index.html itself is still
     browser-cached: it polls version.txt (never cached) and, when a newer build exists,
     auto-reloads at boot (before you're deep in a run) or offers an Update button. -->
<script>
(function () {
  var BUILD = "bc15975";
  var checking = false, first = true;
  function banner(latest) {
    if (document.getElementById("bm-update")) return;
    var b = document.createElement("button");
    b.id = "bm-update";
    b.textContent = "🔄 New version available — Update";
    b.style.cssText = "position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2147483647;"
      + "font:600 15px/1.1 Georgia,serif;color:#1a1208;background:#e8b34a;border:2px solid #7a4a12;"
      + "border-radius:9px;padding:11px 18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.55)";
    b.onclick = function () { location.href = location.pathname + "?v=" + latest; };
    (document.body || document.documentElement).appendChild(b);
  }
  function check(auto) {
    if (checking) return; checking = true;
    fetch("version.txt?_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) {
        if (!t) return;
        t = t.trim();
        if (!t || t === BUILD) return;
        var already = location.search.indexOf("v=" + t) !== -1;   // guard against reload loops on CDN lag
        if (auto && first && !already) { location.replace(location.pathname + "?v=" + t); return; }
        banner(t);
      })
      .catch(function () {})
      .then(function () { checking = false; first = false; });
  }
  setTimeout(function () { check(true); }, 2000);            // auto-update at boot
  window.addEventListener("focus", function () { check(false); });  // button on tab refocus
  window.addEventListener("error", function (e) {           // stale HTML 404'd a hashed asset -> recover now
    var t = e && e.target, src = (t && (t.src || t.href)) || "";
    if (/\.(wasm|pck|js)(\?|$)/.test(src)) check(true);
  }, true);
})();
</script>
